      responses: { "200": { description: ok } }
  /admin/commissions/{id}/release:
    post:
      tags: [Admin分销]
      summary: suspect 解除（恢复 pending）
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /admin/commissions/{id}/cancel:
    post:
      tags: [Admin分销]
      summary: 作废佣金（人工判定刷单）
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string }
      responses: { "200": { description: ok } }
  /admin/withdraws:
    get:
      tags: [Admin分销]
      summary: 提现工单列表
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
      responses: { "200": { description: ok } }
  /admin/withdraws/{id}/retry:
    post:
      tags: [Admin分销]
      summary: 失败工单重试（重新调起 wxpay.Transfer）
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /admin/share-links:
    get:
      tags: [Admin分销]
      summary: 分享链接监控
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: user_id, in: query, schema: { type: string } }
        - { name: scene, in: query, schema: { type: string } }
      responses: { "200": { description: ok } }
  /admin/distribution/dashboard:
    get:
      tags: [Admin分销]
      summary: 分销全链路看板
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: start, in: query, schema: { type: string, format: date } }
        - { name: end, in: query, schema: { type: string, format: date } }
      responses: { "200": { description: ok } }

  # ========== v1.2 PRD 18 微信商家转账回调 ==========
  /notify/wxpay/transfer:
    post:
      tags: [开放接口]
      summary: 微信商家转账到零钱回调
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "200":
          description: SUCCESS
          content:
            application/json:
              schema:
                type: object
                properties:
                  code: { type: string, example: SUCCESS }

  # ========== C 端售后（v1.4）==========
  /c/aftersales:
    post:
      tags: [C端售后]
      summary: 申请售后
      description: |
        要求 order.status ∈ {paid, shipped, completed}。
        服务端校验 refund_amount_cents 上限：item 级 ≤ item.price*qty；整单 ≤ order.pay_cents - 已成功退款合计。
        同一 order_item 已有非终态售后单时返回 409。
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AftersaleApplyReq' }
      responses:
        "200":
          description: 申请成功，返回 aftersale_no 与 id
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResp'
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          id:           { type: string }
                          aftersale_no: { type: string }
    get:
      tags: [C端售后]
      summary: 我的售后列表
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - { name: page,      in: query, schema: { type: integer, default: 1 } }
        - { name: page_size, in: query, schema: { type: integer, default: 20 } }
        - { name: status,    in: query, schema: { $ref: '#/components/schemas/AftersaleStatus' } }
      responses:
        "200":
          description: 分页列表
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResp'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PagedResult' }

  /c/aftersales/{id}:
    get:
      tags: [C端售后]
      summary: 售后单详情（含协商记录）
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 详情
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResp'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AftersaleOrderDetail' }

  /c/aftersales/{id}/express:
    post:
      tags: [C端售后]
      summary: 回填寄回运单
      description: 要求当前 status=seller_agreed 且 type ∈ {refund_return, exchange}。
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AftersaleExpressReq' }
      responses:
        "200":
          description: 回填成功
          content: { application/json: { schema: { $ref: '#/components/schemas/BaseResp' } } }

  /c/aftersales/{id}/messages:
    post:
      tags: [C端售后]
      summary: 追加协商内容/补充凭证
      description: 非终态可用。content 与 evidence 至少一项非空。
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AftersaleMessageReq' }
      responses:
        "200":
          description: 已写入协商记录
          content: { application/json: { schema: { $ref: '#/components/schemas/BaseResp' } } }

  /c/aftersales/{id}/cancel:
    post:
      tags: [C端售后]
      summary: 用户撤销售后
      description: 要求当前 status=applying。撤销后进入 cancelled 终态；用户可重新发起新单。
      security:
        - BearerAuth: []
        - CookieAuth: []
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 已撤销
          content: { application/json: { schema: { $ref: '#/components/schemas/BaseResp' } } }
