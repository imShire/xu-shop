  # ========== v1.2 PRD 18 分享 / 分销（C 端） ==========
  /c/share/links:
    post:
      tags: [C端分销]
      summary: 创建分享链接（任何登录用户）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/ShareLinkForm' } } }
      responses:
        "200":
          description: ok
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/Response'
                  - properties: { data: { $ref: '#/components/schemas/ShareLink' } }
  /c/share/poster:
    post:
      tags: [C端分销]
      summary: 生成海报图片（OSS 临时 URL）
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [share_link_id]
              properties:
                share_link_id: { type: string }
      responses: { "200": { description: ok } }
  /s/{short_token}:
    get:
      tags: [开放接口]
      summary: 短链 302 跳转 + 写入 share_click（H5 入口）
      parameters: [{ name: short_token, in: path, required: true, schema: { type: string } }]
      responses:
        "302":
          description: 重定向到具体业务页
        "404": { description: 无效短链 }
  /c/distributors/apply:
    post:
      tags: [C端分销]
      summary: 申请成为分销员
      security: [{ BearerAuth: [] }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/DistributorApplyForm' } } }
      responses: { "200": { description: ok } }
  /c/distributors/me:
    get:
      tags: [C端分销]
      summary: 我的分销员资料
      security: [{ BearerAuth: [] }]
      responses: { "200": { description: ok } }
  /c/distributors/me/commissions:
    get:
      tags: [C端分销]
      summary: 我的佣金列表
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: page, in: query, schema: { type: integer, default: 1 } }
      responses: { "200": { description: ok } }
  /c/distributors/me/withdraws:
    get:
      tags: [C端分销]
      summary: 我的提现工单
      security: [{ BearerAuth: [] }]
      responses: { "200": { description: ok } }
    post:
      tags: [C端分销]
      summary: 申请提现（需 sms_code 二次确认）
      security: [{ BearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: '#/components/schemas/WithdrawForm' } } }
      responses: { "200": { description: ok } }
  /c/distributors/me/withdraw-sms:
    post:
      tags: [C端分销]
      summary: 发送提现短信验证码（5min 有效，5/天）
      security: [{ BearerAuth: [] }]
      responses: { "200": { description: ok } }

  # ========== v1.2 PRD 18 分销（admin） ==========
  /admin/distributors:
    get:
      tags: [Admin分销]
      summary: 分销员列表
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: status, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { type: string } }
      responses: { "200": { description: ok } }
  /admin/distributors/{id}/approve:
    post:
      tags: [Admin分销]
      summary: 通过申请
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
      responses: { "200": { description: ok } }
  /admin/distributors/{id}/reject:
    post:
      tags: [Admin分销]
      summary: 拒绝申请
      security: [{ BearerAuth: [] }]
      parameters: [{ name: id, in: path, required: true, schema: { type: string } }]
