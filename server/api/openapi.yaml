  # ========== Admin 售后（v1.4：售后单独立链路，取代 Phase 3 legacy GET）==========
  /admin/aftersales:
    get:
      tags: [Admin售后]
      summary: 售后单列表（需权限 aftersale.view）
      description: |
        基于 aftersale_order 表返回。v1.4 起取代 Phase 3 legacy 实现（旧实现按 order.cancel_request_pending 过滤）。
      security:
        - BearerAuth: []
      parameters:
        - { name: page,          in: query, schema: { type: integer, default: 1 } }
        - { name: page_size,     in: query, schema: { type: integer, default: 20 } }
        - { name: status,        in: query, schema: { type: string, enum: [applying, seller_agreed, buyer_returned, seller_received, completed, seller_rejected, cancelled, closed] } }
        - { name: type,          in: query, schema: { type: string, enum: [refund_only, refund_return, exchange] } }
        - { name: keyword,       in: query, schema: { type: string }, description: 匹配 aftersale_no / order_no }
        - { name: applied_from,  in: query, schema: { type: string, format: date-time } }
        - { name: applied_to,    in: query, schema: { type: string, format: date-time } }
      responses:
        "200":
          description: 售后单分页列表（PagedResult 包 AftersaleOrder 数组）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResp'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/PagedResult' }

  /admin/aftersales/{id}:
    get:
      tags: [Admin售后]
      summary: 售后单详情（含协商记录，需权限 aftersale.view）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string }, description: aftersale_id }
      responses:
        "200":
          description: 售后单详情 + negotiations[]
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/BaseResp'
                  - type: object
                    properties:
                      data: { $ref: '#/components/schemas/AftersaleOrderDetail' }

  /admin/aftersales/{id}/agree:
    post:
      tags: [Admin售后]
      summary: 同意售后（需权限 aftersale.process，敏感接口）
      description: |
        - type=refund_only：进入 seller_agreed 后异步触发 payment.ApplyRefund；refund 回调成功后状态推进到 completed。
        - type=refund_return / exchange：进入 seller_agreed 等待买家寄回。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seller_remark: { type: string, maxLength: 500, description: "可选；备注会写入 aftersale_negotiation(role=seller)" }
                return_address_id: { type: string, nullable: true, description: "refund_return/exchange 可指定寄回地址；为空走默认发货地址" }
      responses:
        "200":
          description: 同意成功
          content: { application/json: { schema: { $ref: '#/components/schemas/BaseResp' } } }

  /admin/aftersales/{id}/reject:
    post:
      tags: [Admin售后]
      summary: 拒绝售后（需权限 aftersale.process）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 2, maxLength: 200 }
      responses:
        "200":
          description: 已拒绝
          content: { application/json: { schema: { $ref: '#/components/schemas/BaseResp' } } }

  /admin/aftersales/{id}/confirm-received:
    post:
      tags: [Admin售后]
      summary: 确认收货（需权限 aftersale.process，敏感接口）
      description: |
        要求当前 status=buyer_returned。确认后进入 seller_received，refund_only/refund_return 异步触发 payment.ApplyRefund；exchange 直接置 completed。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                seller_remark: { type: string, maxLength: 500 }
      responses:
        "200":
          description: 确认成功
          content: { application/json: { schema: { $ref: '#/components/schemas/BaseResp' } } }

  /admin/aftersales/{id}/messages:
    post:
      tags: [Admin售后]
      summary: 商家追加协商内容/补充凭证（需权限 aftersale.process）
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AftersaleMessageReq' }
      responses:
        "200":
          description: 已写入协商记录
          content: { application/json: { schema: { $ref: '#/components/schemas/BaseResp' } } }

  /admin/aftersales/{id}/close:
    post:
      tags: [Admin售后]
      summary: 手动关闭售后单（需权限 aftersale.process，敏感接口）
      description: 极端兜底关闭；会写 audit_log。要求当前 status 非终态。
      security: [{ BearerAuth: [] }]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 2, maxLength: 200 }
      responses:
        "200":
          description: 已关闭
          content: { application/json: { schema: { $ref: '#/components/schemas/BaseResp' } } }

