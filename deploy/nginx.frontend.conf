# xu-shop frontend nginx 配置
# 与 deploy/Dockerfile 的 frontend stage 配套：
#   admin  → /usr/share/nginx/admin   (listen 5273)
#   client → /usr/share/nginx/client  (listen 10086, SPA)
# API 反代到 compose service `api:8080`，前端打包时 VITE_API_BASE=/api/v1。

# ─── 真实客户端 IP（限流 / 审计 / 风控依赖）─────────────────────────────────────
# 阿里云 SLB / VPC / Docker bridge 网段全部信任
# real_ip_recursive on：沿 XFF 链回溯，跳过所有 trusted 节点
map $http_x_forwarded_for $client_real_ip { default $remote_addr; }

# 这些指令必须放在 server 级别（http 级别在主 nginx.conf 控制），用 include 简化重复
# 由于 docker 镜像把本文件复制到 conf.d/default.conf，所以在每个 server 块内单独声明

# ─── 共享 proxy 配置 ──────────────────────────────────────────────────────────
proxy_http_version 1.1;
proxy_set_header Connection "";

# ─── admin: 后台 SPA + /api/v1 反代 ───────────────────────────────────────────
server {
    listen 5273;
    server_name _;

    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # 使用 docker 内置 DNS（127.0.0.11）+ 变量 proxy_pass
    # 让 nginx 启动时不强解析 upstream，且每次请求按 TTL 重新解析，避免 api 容器重启后 IP 失效。
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8080;

    root /usr/share/nginx/admin;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml application/wasm;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # API 反代（admin 调用 /api/v1/admin/*）
    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # hash 文件名（assets/*.[hash].js）长缓存
    location ~* ^/assets/.*\.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ─── client H5: 顾客端 SPA + /api/v1 反代 ─────────────────────────────────────
server {
    listen 10086;
    server_name _;

    set_real_ip_from 100.64.0.0/10;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $api_upstream http://api:8080;

    root /usr/share/nginx/client;
    index index.html;

    client_max_body_size 32m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml application/wasm;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    location /api/ {
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?|webp)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer-when-downgrade" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
